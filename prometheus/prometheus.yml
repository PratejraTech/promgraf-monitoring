global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'n8n'
    metrics_path: /metrics
    static_configs:
      - targets: ['n8n:5678']
        labels:
          app: n8n
          env: production

  # Optional: host/node metrics if you add node_exporter later
  # - job_name: 'node'
  #   static_configs:
  #     - targets: ['node-exporter:9100']
